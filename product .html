<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สินค้าทั้งหมด — Body Scent</title>
  <meta name="description" content="น้ำหอมฉีดตัวและโรลออน Body Scent เลือกกรองตามมู้ด Fresh, Sweet, Confident และ Romance">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Jost:wght@300;400;500&amp;family=Noto+Serif+Thai:wght@300;400;500&amp;family=Noto+Sans+Thai:wght@300;400;500&amp;display=swap">
  <style>
/* ==========================================================================
   Body Scent — Global theme
   โทนพรีเมียม เรียบหรู มินิมอล | ขาว-ครีม-เบจเข้ม + ทอง/บรอนซ์อ่อน
   ========================================================================== */


/* --------------------------------------------------------------------------
   1. Design tokens
   -------------------------------------------------------------------------- */
:root {
  /* พื้นหลัง: ขาว → ครีม → เบจ */
  --white: #fefdfb;
  --cream: #f8f3ea;
  --cream-deep: #efe6d6;
  --beige: #d9c9ae;
  --beige-dark: #a8957a;

  /* ตัวอักษร: น้ำตาลเข้มนุ่ม ไม่ใช้ดำสนิท */
  --ink: #2e2822;
  --ink-soft: #5f5548;
  --ink-faint: #8a7e6f;

  /* สีเน้น: ทอง/บรอนซ์อ่อน */
  --accent: #b08d57;
  --accent-deep: #80663a; /* ใช้กับข้อความบนพื้นครีม (contrast ผ่าน) */
  --accent-soft: #e6d6b8;

  /* เส้นขอบ: บางและนุ่ม */
  --line: rgba(46, 40, 34, 0.18);
  --line-strong: rgba(46, 40, 34, 0.55);
  --line-accent: rgba(176, 141, 87, 0.6);

  /* สีของแต่ละ mood — ใช้เป็นจุดเล็กๆ เท่านั้น */
  --mood-fresh: #2f5d4a; /* เขียวเข้ม */
  --mood-sweet: #7a5c9e; /* ม่วงกลาง */
  --mood-confident: #3e4f63; /* น้ำเงินเทาเข้ม */
  --mood-romance: #c47070; /* แดงอ่อน */

  /* ฟอนต์ */
  --font-display: "Cormorant Garamond", "Noto Serif Thai", Georgia, "Times New Roman", serif;
  --font-body: "Jost", "Noto Sans Thai", "Helvetica Neue", Arial, sans-serif;

  /* สเกลตัวอักษร */
  --text-xs: 0.8125rem;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-lg: 1.25rem;
  --text-xl: clamp(1.5rem, 1.2rem + 1vw, 1.875rem);
  --text-2xl: clamp(2rem, 1.5rem + 2vw, 3rem);
  --text-3xl: clamp(2.5rem, 1.6rem + 4vw, 4.5rem);

  /* ระยะห่าง (เว้นเยอะให้โปร่ง) */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2.5rem;
  --space-5: 4rem;
  --space-6: 6rem;
  --space-7: 9rem;

  --container: 72rem;
  --container-narrow: 44rem;
  --gutter: clamp(1.25rem, 5vw, 3rem);

  --radius: 2px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* --------------------------------------------------------------------------
   2. Reset & base
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 300;
  line-height: 1.85; /* Thai ต้องการ line-height กว้างกว่าปกติ */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img,
picture,
svg {
  display: block;
  max-width: 100%;
}

img {
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

:focus-visible {
  outline: 1px solid var(--accent-deep);
  outline-offset: 4px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* --------------------------------------------------------------------------
   3. Typography
   -------------------------------------------------------------------------- */
h1,
h2,
h3,
h4 {
  margin: 0 0 var(--space-3);
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: 0.01em;
  color: var(--ink);
}

h1 {
  font-size: var(--text-3xl);
  font-weight: 300;
  line-height: 1.15;
}
h2 {
  font-size: var(--text-2xl);
}
h3 {
  font-size: var(--text-xl);
}
h4 {
  font-size: var(--text-lg);
}

p {
  margin: 0 0 var(--space-3);
  max-width: 38rem;
  color: var(--ink-soft);
}

.lead {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  line-height: 1.7;
  color: var(--ink-soft);
}

.text-small {
  font-size: var(--text-sm);
}

.text-muted {
  color: var(--ink-faint);
}

.text-accent {
  color: var(--accent-deep);
}

.text-center {
  text-align: center;
}

.text-center p {
  margin-inline: auto;
}

/* เส้นทองสั้นๆ ใต้หัวข้อ */
.heading-rule::after {
  content: "";
  display: block;
  width: 3rem;
  height: 1px;
  margin-top: var(--space-3);
  background: var(--accent);
}

.text-center.heading-rule::after,
.text-center .heading-rule::after {
  margin-inline: auto;
}

/* --------------------------------------------------------------------------
   4. Layout
   -------------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: calc(var(--container) + var(--gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.container--narrow {
  max-width: calc(var(--container-narrow) + var(--gutter) * 2);
}

/* ระยะห่างระหว่าง section กำหนดที่เดียว เพื่อไม่ให้ selector ตีกัน */
.section {
  padding-block: var(--space-6);
}

.section--tight {
  padding-block: var(--space-5);
}

.section--cream-deep {
  background: var(--cream-deep);
}

.section--white {
  background: var(--white);
}

.section--divided {
  border-top: 1px solid var(--line);
}

.section-head {
  margin-bottom: var(--space-5);
}

.grid {
  display: grid;
  gap: var(--space-4);
}

.grid--2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid--3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.grid--4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.stack > * + * {
  margin-top: var(--space-3);
}

/* --------------------------------------------------------------------------
   5. Header & navigation
   -------------------------------------------------------------------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(248, 243, 234, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.site-header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  min-height: 4.5rem;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink);
}

.nav {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.nav a {
  position: relative;
  padding-block: 0.25rem;
  font-size: var(--text-sm);
  color: var(--ink-soft);
  transition: color 0.3s var(--ease);
}

.nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 100%;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s var(--ease);
}

.nav a:hover,
.nav a[aria-current="page"] {
  color: var(--ink);
}

.nav a:hover::after,
.nav a[aria-current="page"]::after {
  transform: scaleX(1);
}

/* --------------------------------------------------------------------------
   6. Buttons — เส้นบางสีเข้มนุ่มตา
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.95rem 2.5rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: 0.06em;
  line-height: 1.4;
  cursor: pointer;
  transition: background-color 0.3s var(--ease), color 0.3s var(--ease),
    border-color 0.3s var(--ease);
}

.btn:hover {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
}

.btn--accent {
  border-color: var(--accent-deep);
  color: var(--accent-deep);
}

.btn--accent:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
  color: var(--white);
}

.btn--solid {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
}

.btn--solid:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

.btn--block {
  width: 100%;
}

.btn[disabled],
.btn[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
}

.link-line {
  display: inline-block;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--line-accent);
  color: var(--accent-deep);
  transition: border-color 0.3s var(--ease);
}

.link-line:hover {
  border-color: var(--accent-deep);
}

/* --------------------------------------------------------------------------
   7. Mood — สีแตะเบาๆ เป็นจุดเล็กๆ เท่านั้น ไม่ทาพื้นหลังการ์ด
   ใช้: <span class="mood mood--fresh"><i class="mood__dot"></i>Fresh</span>
   หรือ: เติม class mood--fresh ที่ element ใดก็ได้ แล้วใช้ .mood-underline
   -------------------------------------------------------------------------- */
.mood--fresh {
  --mood-color: var(--mood-fresh);
}
.mood--sweet {
  --mood-color: var(--mood-sweet);
}
.mood--confident {
  --mood-color: var(--mood-confident);
}
.mood--romance {
  --mood-color: var(--mood-romance);
}

.mood {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

.mood__dot {
  display: inline-block;
  flex: none;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--mood-color, var(--accent));
}

/* เส้นสั้นๆ ใต้หัวข้อ */
.mood-underline::after {
  content: "";
  display: block;
  width: 2rem;
  height: 2px;
  margin-top: var(--space-2);
  background: var(--mood-color, var(--accent));
}

.mood-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.75rem;
  height: 2.75rem;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--mood-color, var(--accent));
}

/* --------------------------------------------------------------------------
   8. Product card
   -------------------------------------------------------------------------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: var(--space-5) var(--space-4);
}

.product-card {
  display: flex;
  flex-direction: column;
  background: transparent;
}

.product-card__media {
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--cream-deep);
}

.product-card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s var(--ease);
}

.product-card:hover .product-card__media img {
  transform: scale(1.03);
}

.product-card__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  padding-top: var(--space-3);
}

.product-card__name {
  margin: var(--space-1) 0 0.25rem;
  font-size: var(--text-lg);
  line-height: 1.4;
}

.product-card__meta {
  margin: 0 0 var(--space-2);
  font-size: var(--text-sm);
  color: var(--ink-faint);
}

.product-card__desc {
  flex: 1;
  margin-bottom: var(--space-3);
  font-size: var(--text-sm);
  line-height: 1.8;
}

.product-card__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--line);
}

.price {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--ink);
}

.price small {
  margin-left: 0.25rem;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 300;
  color: var(--ink-faint);
}

/* --------------------------------------------------------------------------
   9. Filter / tabs (สำหรับกรอง mood และ type)
   -------------------------------------------------------------------------- */
.filter {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  margin-bottom: var(--space-5);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--line);
}

.filter__item {
  position: relative;
  padding: 0.5rem 0.25rem;
  border: 0;
  background: none;
  font-size: var(--text-sm);
  color: var(--ink-faint);
  cursor: pointer;
  transition: color 0.3s var(--ease);
}

.filter__item::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: var(--accent-deep);
  transform: scaleX(0);
  transition: transform 0.3s var(--ease);
}

.filter__item:hover,
.filter__item[aria-pressed="true"],
.filter__item.is-active {
  color: var(--ink);
}

.filter__item[aria-pressed="true"]::after,
.filter__item.is-active::after {
  transform: scaleX(1);
}

/* --------------------------------------------------------------------------
   10. Hero
   -------------------------------------------------------------------------- */
.hero {
  padding-block: var(--space-7) var(--space-6);
  background: linear-gradient(180deg, var(--white) 0%, var(--cream) 100%);
}

.hero h1 {
  max-width: 14ch;
}

.hero p {
  max-width: 32rem;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

/* --------------------------------------------------------------------------
   11. Forms
   -------------------------------------------------------------------------- */
.field {
  display: block;
  margin-bottom: var(--space-3);
}

.field label {
  display: block;
  margin-bottom: 0.5rem;
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

.input,
.select,
.textarea {
  width: 100%;
  padding: 0.85rem 0;
  border: 0;
  border-bottom: 1px solid var(--line-strong);
  border-radius: 0;
  background: transparent;
  transition: border-color 0.3s var(--ease);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--ink-faint);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-bottom-color: var(--accent-deep);
}

.textarea {
  min-height: 7rem;
  resize: vertical;
}

/* --------------------------------------------------------------------------
   12. Misc components
   -------------------------------------------------------------------------- */
.divider {
  height: 1px;
  margin-block: var(--space-5);
  border: 0;
  background: var(--line);
}

.divider--accent {
  width: 3rem;
  margin-inline: auto;
  background: var(--accent);
}

.badge {
  display: inline-block;
  padding: 0.2rem 0.85rem;
  border: 1px solid var(--line-accent);
  border-radius: 999px;
  font-size: var(--text-xs);
  color: var(--accent-deep);
}

.feature {
  padding: var(--space-4) 0;
  border-top: 1px solid var(--line);
}

.feature h3 {
  margin-bottom: var(--space-1);
}

.feature p {
  margin-bottom: 0;
  font-size: var(--text-sm);
}

/* --------------------------------------------------------------------------
   13. Footer
   -------------------------------------------------------------------------- */
.site-footer {
  padding-block: var(--space-5) var(--space-4);
  background: var(--cream-deep);
  border-top: 1px solid var(--line);
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

.site-footer a {
  transition: color 0.3s var(--ease);
}

.site-footer a:hover {
  color: var(--accent-deep);
}

.site-footer__grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.site-footer__bottom {
  padding-top: var(--space-3);
  border-top: 1px solid var(--line);
  font-size: var(--text-xs);
  color: var(--ink-faint);
}

/* --------------------------------------------------------------------------
   14. Responsive
   -------------------------------------------------------------------------- */
@media (max-width: 64rem) {
  .grid--4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 48rem) {
  :root {
    --space-5: 3rem;
    --space-6: 4.5rem;
    --space-7: 6rem;
  }

  body {
    font-size: 1rem;
  }

  .grid--2,
  .grid--3,
  .grid--4 {
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  .site-header__inner {
    min-height: 4rem;
  }

  .nav {
    gap: var(--space-3);
  }

  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4) var(--space-2);
  }

  .product-card__footer {
    flex-direction: column;
    align-items: stretch;
  }

  .product-card__footer .btn {
    padding-inline: 1rem;
  }

  .hero__actions .btn {
    width: 100%;
  }

  .site-footer__grid {
    grid-template-columns: 1fr;
    gap: var(--space-3);
  }
}

@media (max-width: 30rem) {
  .product-grid {
    grid-template-columns: 1fr;
  }

  .nav a {
    font-size: var(--text-xs);
  }
}

/* --------------------------------------------------------------------------
   15. Reduced motion
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

  </style>
</head>

        </div>
        <div>
          <h4>เมนู</h4>
          <ul class="stack text-small">
            <li><a href="index.html">หน้าแรก</a></li>

"โรลออน Fresh", "mood": "fresh", "type": "rollon", "size": null, "price": 149, "image": "images/fresh.jpg", "description": "โรลออนกลิ่นสดชื่น โปร่งเบา ทาได้ตรงจุด พกพาง่าย"}, {"id": "rollon-sweet", "name": "โรลออน Sweet", "mood": "sweet", "type": "rollon", "size": null, "price": 149, "image": "images/sweet.jpg", "description": "โรลออนกลิ่นหวานนุ่ม อบอุ่น ทาได้ตรงจุด พกพาง่าย"}];

  var SHEET_ID = '1-3jcm0As7TYGmHJKS8zWc_fx0tjHPKDmlZpUl8xIqBE';
  // ถ้าข้อมูลอยู่ในแท็บที่ไม่ใช่แท็บแรก ให้ใส่ gid ของแท็บนั้น (ดูได้ใน URL หลัง #gid=)
  var SHEET_GID = '';

    'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv' +

  var MOODS = [
    { key: 'all', label: 'ทั้งหมด' },
    { key: 'fresh', label: 'Fresh' },

    { key: 'confident', label: 'Confident' },

  /* ------------------------------------------------------------------------
     Helpers
     ------------------------------------------------------------------------ */
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function formatPrice(value) {
    var n = Number(value);
    return isNaN(n) ? String(value) : n.toLocaleString('th-TH');
  }

  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();

  /* ========================================================================
     1) product.html
     ======================================================================== */
  function initProducts() {
    var filterBar = document.getElementById('filter-bar');
    var list = document.getElementById('product-list');
    if (!filterBar || !list) return;

    var products = [];
    var currentMood = 'all';

    function isValidMood(key) {
      return MOODS.some(function (m) { return m.key === key; });
    }

    function getMoodFromUrl() {
      var mood = (new URLSearchParams(window.location.search).get('mood') || '').toLowerCase();
      return isValidMood(mood) ? mood : 'all';
    }

    function syncUrl(mood) {
      if (!window.history || !history.replaceState) return;
      var url = new URL(window.location.href);
      if (mood === 'all') {
        url.searchParams.delete('mood');
      } else {
        url.searchParams.set('mood', mood);
      }
      try { history.replaceState(null, '', url.toString()); } catch (e) {}
    }

    function buildOrderUrl(product) {
      var item = product.name + (product.size ? ' ' + product.size : '');
      var params = new URLSearchParams();
      params.set('item', item);
      params.set('price', product.price);
      return 'order.html?' + params.toString();
    }

    function renderFilters() {
      filterBar.textContent = '';
      MOODS.forEach(function (m) {
        var btn = el('button', 'filter__item', m.label);
        btn.type = 'button';
        btn.setAttribute('data-mood', m.key);
        btn.setAttribute('aria-pressed', String(m.key === currentMood));
        btn.addEventListener('click', function () {
          setMood(m.key);
        });
        filterBar.appendChild(btn);
      });
    }

    function createCard(product) {
      var card = el('article', 'product-card');

      var media = el('div', 'product-card__media');
      var img = el('img');
      img.src = product.image;
      img.alt = product.name;
      img.loading = 'lazy';
      media.appendChild(img);
      card.appendChild(media);

      var body = el('div', 'product-card__body');

      var moodLabel = MOODS.filter(function (m) { return m.key === product.mood; })[0];
      var mood = el('span', 'mood mood--' + product.mood);
      mood.appendChild(el('i', 'mood__dot'));
      mood.appendChild(document.createTextNode(moodLabel ? moodLabel.label : product.mood));
      body.appendChild(mood);

      body.appendChild(el('h3', 'product-card__name', product.name));

      var meta = product.size || (product.type === 'rollon' ? 'โรลออน' : '');
      if (meta) body.appendChild(el('p', 'product-card__meta', meta));

      var footer = el('div', 'product-card__footer');
      var price = el('span', 'price', formatPrice(product.price));
      price.appendChild(el('small', null, 'บาท'));
      footer.appendChild(price);

      var order = el('a', 'btn btn--accent', 'สั่งซื้อ');
      order.href = buildOrderUrl(product);
      footer.appendChild(order);

      body.appendChild(footer);
      card.appendChild(body);
      return card;
    }

    function renderProducts() {
      var shown = products.filter(function (p) {
        return currentMood === 'all' || p.mood === currentMood;
      });

      list.textContent = '';
      if (!shown.length) {
        list.appendChild(el('p', 'text-muted', 'ไม่พบสินค้าในหมวดนี้'));
        return;
      }
      shown.forEach(function (p) {
        list.appendChild(createCard(p));
      });
    }

    function setMood(mood) {
      currentMood = mood;
      Array.prototype.forEach.call(filterBar.querySelectorAll('.filter__item'), function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-mood') === mood));
      });
      renderProducts();
      syncUrl(mood);
    }

    currentMood = getMoodFromUrl();
    renderFilters();
    list.appendChild(el('p', 'text-muted', 'กำลังโหลดสินค้า...'));

    Promise.resolve(PRODUCTS_DATA)
      .then(function (data) {
        products = Array.isArray(data) ? data : [];
        renderProducts();
      })
      .catch(function (error) {
        console.error(error);
        list.textContent = '';
        list.appendChild(el('p', 'text-muted', 'โหลดข้อมูลสินค้าไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง'));
      });
  }

  /* ========================================================================
     2) order.html
     ======================================================================== */
  function initOrder() {
    var form = document.getElementById('orderForm');
    if (!form) return;

    var itemsInput = document.getElementById('items');
    var totalInput = document.getElementById('total');

    // เติมข้อมูลจาก URL parameter ทันทีที่โหลดหน้า (ทั้ง items และ total)
    var params = new URLSearchParams(window.location.search);
    var item = params.get('item');
    var price = params.get('price');
    if (itemsInput && item) itemsInput.value = item;
    if (totalInput && price) totalInput.value = price;

    function valueOf(id) {
      var node = document.getElementById(id);
      return node ? node.value.trim() : '';
    }

    var submitting = false;
    var submitBtn = form.querySelector('[type="submit"]');

    function setSubmitting(state) {
      submitting = state;
      if (submitBtn) submitBtn.disabled = state;
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (submitting) return;
      if (typeof form.reportValidity === 'function' && !form.reportValidity()) return;

      var payload = {
        customerName: valueOf('customerName'),
        contact: valueOf('contact'),
        items: valueOf('items'),
        total: valueOf('total'),
        note: valueOf('note')
      };

      setSubmitting(true);

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
        .then(() => { window.location.href = 'thankyou.html'; })
        .catch(error => {
          console.error(error);
          alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
          setSubmitting(false);
        });
    });
  }

  // Parser CSV (รองรับ ", ขึ้นบรรทัดใหม่ในเครื่องหมายคำพูด, "" และ CRLF)
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;

    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1); // ตัด BOM

    for (var i = 0; i < text.length; i++) {
      var ch = text[i];

      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        row.push(field);
        field = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else {
        field += ch;
      }
    }

    if (field !== '' || row.length) {
      row.push(field);
      rows.push(row);
    }

    // ตัดแถวว่างทิ้ง
    return rows.filter(function (r) {
      return r.some(function (cell) { return cell.trim() !== ''; });
    });
  }

  function initAdmin() {
    var tbody = document.querySelector('#ordersTable tbody');
    if (!tbody) return;

    var COLUMN_COUNT = 6;

    // ชื่อหัวคอลัมน์ที่รู้จัก (ถ้าไม่ตรง จะใช้ลำดับคอลัมน์ 1-6 ตามที่กำหนด)
    var COLUMN_ALIASES = [
      ['timestamp', 'date', 'datetime', 'วันเวลา', 'วันที่', 'เวลา'],
      ['customername', 'name', 'ชื่อลูกค้า', 'ชื่อ'],
      ['contact', 'phone', 'เบอร์โทร', 'ติดต่อ', 'เบอร์โทร/line'],
      ['items', 'item', 'รายการสินค้า', 'สินค้า', 'รายการ'],
      ['total', 'price', 'จำนวนเงินรวม', 'ยอดรวม', 'ราคา'],
      ['note', 'notes', 'หมายเหตุ']
    ];

    function showMessage(message) {
      tbody.textContent = '';
      var tr = el('tr');
      var td = el('td', 'text-muted', message);
      td.colSpan = COLUMN_COUNT;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    function resolveColumns(headerRow) {
      var header = headerRow.map(function (h) { return h.trim().toLowerCase(); });
      return COLUMN_ALIASES.map(function (aliases, position) {
        for (var i = 0; i < header.length; i++) {
          if (aliases.indexOf(header[i]) !== -1) return i;
        }
        return position;
      });
    }

    function render(rows) {
      if (rows.length < 2) {
        showMessage('ยังไม่มีรายการสั่งซื้อ');
        return;
      }

      var columns = resolveColumns(rows[0]);
      // รายการถูกเพิ่มต่อท้ายชีตเสมอ จึงกลับลำดับให้รายการล่าสุดขึ้นก่อน
      var data = rows.slice(1).reverse();

      tbody.textContent = '';
      data.forEach(function (row) {
        var tr = el('tr');
        columns.forEach(function (colIndex, i) {
          var value = (row[colIndex] || '').trim();
          if (i === 4 && value !== '') value = formatPrice(value) + ' บาท';
          tr.appendChild(el('td', null, value));
        });
        tbody.appendChild(tr);
      });
    }

    showMessage('กำลังโหลดข้อมูล...');

    fetch(SHEET_CSV_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        render(parseCSV(text));
      })
      .catch(function (error) {
        console.error(error);
        showMessage('โหลดข้อมูลไม่สำเร็จ ตรวจสอบว่าแชร์ชีตแบบ "ทุกคนที่มีลิงก์ดูได้" แล้ว');
      });
  }
