<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณที่สั่งซื้อ — Body Scent</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Jost:wght@300;400;500&amp;family=Noto+Serif+Thai:wght@300;400;500&amp;family=Noto+Sans+Thai:wght@300;400;500&amp;display=swap">
  <style>
/* ==========================================================================
   Body Scent — Global theme
   โทนพรีเมียม เรียบหรู มินิมอล | ขาว-ครีม-เบจเข้ม + ทอง/บรอนซ์อ่อน
   ========================================================================== */


/* --------------------------------------------------------------------------
   1. Design tokens
   -------------------------------------------------------------------------- */
:root {
  /* พื้นหลัง: ขาว → ครีม → เบจ */
  --white: #fefdfb;
  --cream: #f8f3ea;
  --cream-deep: #efe6d6;
  --beige: #d9c9ae;
  --beige-dark: #a8957a;

  /* ตัวอักษร: น้ำตาลเข้มนุ่ม ไม่ใช้ดำสนิท */
  --ink: #2e2822;
  --ink-soft: #5f5548;
  --ink-faint: #8a7e6f;

  /* สีเน้น: ทอง/บรอนซ์อ่อน */
  --accent: #b08d57;
  --accent-deep: #80663a; /* ใช้กับข้อความบนพื้นครีม (contrast ผ่าน) */
  --accent-soft: #e6d6b8;

  /* เส้นขอบ: บางและนุ่ม */
  --line: rgba(46, 40, 34, 0.18);
  --line-strong: rgba(46, 40, 34, 0.55);
  --line-accent: rgba(176, 141, 87, 0.6);

  /* สีของแต่ละ mood — ใช้เป็นจุดเล็กๆ เท่านั้น */
  --mood-fresh: #2f5d4a; /* เขียวเข้ม */
  --mood-sweet: #7a5c9e; /* ม่วงกลาง */
  --mood-confident: #3e4f63; /* น้ำเงินเทาเข้ม */
  --mood-romance: #c47070; /* แดงอ่อน */

  /* ฟอนต์ */
  --font-display: "Cormorant Garamond", "Noto Serif Thai", Georgia, "Times New Roman", serif;
  --font-body: "Jost", "Noto Sans Thai", "Helvetica Neue", Arial, sans-serif;

  /* สเกลตัวอักษร */
  --text-xs: 0.8125rem;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-lg: 1.25rem;
  --text-xl: clamp(1.5rem, 1.2rem + 1vw, 1.875rem);
  --text-2xl: clamp(2rem, 1.5rem + 2vw, 3rem);
  --text-3xl: clamp(2.5rem, 1.6rem + 4vw, 4.5rem);

  /* ระยะห่าง (เว้นเยอะให้โปร่ง) */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2.5rem;
  --space-5: 4rem;
  --space-6: 6rem;
  --space-7: 9rem;

  --container: 72rem;
  --container-narrow: 44rem;
  --gutter: clamp(1.25rem, 5vw, 3rem);

  --radius: 2px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* --------------------------------------------------------------------------
   2. Reset & base
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 300;
  line-height: 1.85; /* Thai ต้องการ line-height กว้างกว่าปกติ */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img,
picture,
svg {
  display: block;
  max-width: 100%;
}

img {
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

:focus-visible {
  outline: 1px solid var(--accent-deep);
  outline-offset: 4px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* --------------------------------------------------------------------------
   3. Typography
   -------------------------------------------------------------------------- */
h1,
h2,
h3,
h4 {
  margin: 0 0 var(--space-3);
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: 0.01em;
  color: var(--ink);
}

h1 {
  font-size: var(--text-3xl);
  font-weight: 300;
  line-height: 1.15;
}
h2 {
  font-size: var(--text-2xl);
}
h3 {
  font-size: var(--text-xl);
}
h4 {
  font-size: var(--text-lg);
}

p {
  margin: 0 0 var(--space-3);
  max-width: 38rem;
  color: var(--ink-soft);
}

.lead {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  line-height: 1.7;
  color: var(--ink-soft);
}

.text-small {
  font-size: var(--text-sm);
}

.text-muted {
  color: var(--ink-faint);
}

.text-accent {
  color: var(--accent-deep);
}

.text-center {
  text-align: center;
}

.text-center p {
  margin-inline: auto;
}

/* เส้นทองสั้นๆ ใต้หัวข้อ */
.heading-rule::after {
  content: "";
  display: block;
  width: 3rem;
  height: 1px;
  margin-top: var(--space-3);
  background: var(--accent);
}

.text-center.heading-rule::after,
.text-center .heading-rule::after {
  margin-inline: auto;
}

/* --------------------------------------------------------------------------
   4. Layout
   -------------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: calc(var(--container) + var(--gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.container--narrow {
  max-width: calc(var(--container-narrow) + var(--gutter) * 2);
}

/* ระยะห่างระหว่าง section กำหนดที่เดียว เพื่อไม่ให้ selector ตีกัน */
.section {
  padding-block: var(--space-6);
}

.section--tight {
  padding-block: var(--space-5);
}

.section--cream-deep {
  background: var(--cream-deep);
}

.section--white {
  background: var(--white);
}

.section--divided {
  border-top: 1px solid var(--line);
}

.section-head {
  margin-bottom: var(--space-5);
}

.grid {
  display: grid;
  gap: var(--space-4);
}

.grid--2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid--3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.grid--4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.stack > * + * {
  margin-top: var(--space-3);
}

/* --------------------------------------------------------------------------
   5. Header & navigation
   -------------------------------------------------------------------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(248, 243, 234, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.site-header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  min-height: 4.5rem;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink);
}

.nav {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.nav a {
  position: relative;
  padding-block: 0.25rem;
  font-size: var(--text-sm);
  color: var(--ink-soft);
  transition: color 0.3s var(--ease);
}

.nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 100%;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s var(--ease);
}

.nav a:hover,
.nav a[aria-current="page"] {
  color: var(--ink);
}

.nav a:hover::after,
.nav a[aria-current="page"]::after {
  transform: scaleX(1);
}

/* --------------------------------------------------------------------------
   6. Buttons — เส้นบางสีเข้มนุ่มตา
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.95rem 2.5rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: 0.06em;
  line-height: 1.4;
  cursor: pointer;
  transition: background-color 0.3s var(--ease), color 0.3s var(--ease),
    border-color 0.3s var(--ease);
}

.btn:hover {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
}

.btn--accent {
  border-color: var(--accent-deep);
  color: var(--accent-deep);
}

.btn--accent:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
  color: var(--white);
}

.btn--solid {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
}

.btn--solid:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

.btn--block {
  width: 100%;
}

.btn[disabled],
.btn[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
}

.link-line {
  display: inline-block;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--line-accent);
  color: var(--accent-deep);
  transition: border-color 0.3s var(--ease);
}

.link-line:hover {
  border-color: var(--accent-deep);
}

/* --------------------------------------------------------------------------
   7. Mood — สีแตะเบาๆ เป็นจุดเล็กๆ เท่านั้น ไม่ทาพื้นหลังการ์ด
   ใช้: <span class="mood mood--fresh"><i class="mood__dot"></i>Fresh</span>
   หรือ: เติม class mood--fresh ที่ element ใดก็ได้ แล้วใช้ .mood-underline
   -------------------------------------------------------------------------- */
.mood--fresh {
  --mood-color: var(--mood-fresh);
}
.mood--sweet {
  --mood-color: var(--mood-sweet);
}
.mood--confident {
  --mood-color: var(--mood-confident);
}
.mood--romance {
  --mood-color: var(--mood-romance);
}

.mood {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

.mood__dot {
  display: inline-block;
  flex: none;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--mood-color, var(--accent));
}

/* เส้นสั้นๆ ใต้หัวข้อ */
.mood-underline::after {
  content: "";
  display: block;
  width: 2rem;
  height: 2px;
  margin-top: var(--space-2);
  background: var(--mood-color, var(--accent));
}

.mood-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.75rem;
  height: 2.75rem;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--mood-color, var(--accent));
}

/* --------------------------------------------------------------------------
   8. Product card
   -------------------------------------------------------------------------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: var(--space-5) var(--space-4);
}

.product-card {
  display: flex;
  flex-direction: column;
  background: transparent;
}

.product-card__media {
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--cream-deep);
}

.product-card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s var(--ease);
}

.product-card:hover .product-card__media img {
  transform: scale(1.03);
}

.product-card__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  padding-top: var(--space-3);
}

.product-card__name {
  margin: var(--space-1) 0 0.25rem;
  font-size: var(--text-lg);
  line-height: 1.4;
}

.product-card__meta {
  margin: 0 0 var(--space-2);
  font-size: var(--text-sm);
  color: var(--ink-faint);
}

.product-card__desc {
  flex: 1;
  margin-bottom: var(--space-3);
  font-size: var(--text-sm);
  line-height: 1.8;
}

.product-card__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--line);
}

.price {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--ink);
}

.price small {
  margin-left: 0.25rem;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 300;
  color: var(--ink-faint);
}

/* --------------------------------------------------------------------------
   9. Filter / tabs (สำหรับกรอง mood และ type)
   -------------------------------------------------------------------------- */
.filter {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  margin-bottom: var(--space-5);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--line);
}

.filter__item {
  position: relative;
  padding: 0.5rem 0.25rem;
  border: 0;
  background: none;
  font-size: var(--text-sm);
  color: var(--ink-faint);
  cursor: pointer;
  transition: color 0.3s var(--ease);
}

.filter__item::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: var(--accent-deep);
  transform: scaleX(0);
  transition: transform 0.3s var(--ease);
}

.filter__item:hover,
.filter__item[aria-pressed="true"],
.filter__item.is-active {
  color: var(--ink);
}

.filter__item[aria-pressed="true"]::after,
.filter__item.is-active::after {
  transform: scaleX(1);
}

/* --------------------------------------------------------------------------
   10. Hero
   -------------------------------------------------------------------------- */
.hero {
  padding-block: var(--space-7) var(--space-6);
  background: linear-gradient(180deg, var(--white) 0%, var(--cream) 100%);
}

.hero h1 {
  max-width: 14ch;
}

.hero p {
  max-width: 32rem;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

/* --------------------------------------------------------------------------
   11. Forms
   -------------------------------------------------------------------------- */
.field {
  display: block;
  margin-bottom: var(--space-3);
}

.field label {
  display: block;
  margin-bottom: 0.5rem;
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

.input,
.select,
.textarea {
  width: 100%;
  padding: 0.85rem 0;
  border: 0;
  border-bottom: 1px solid var(--line-strong);
  border-radius: 0;
  background: transparent;
  transition: border-color 0.3s var(--ease);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--ink-faint);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-bottom-color: var(--accent-deep);
}

.textarea {
  min-height: 7rem;
  resize: vertical;
}

/* --------------------------------------------------------------------------
   12. Misc components
   -------------------------------------------------------------------------- */
.divider {
  height: 1px;
  margin-block: var(--space-5);
  border: 0;
  background: var(--line);
}

.divider--accent {
  width: 3rem;
  margin-inline: auto;
  background: var(--accent);
}

.badge {
  display: inline-block;
  padding: 0.2rem 0.85rem;
  border: 1px solid var(--line-accent);
  border-radius: 999px;
  font-size: var(--text-xs);
  color: var(--accent-deep);
}

.feature {
  padding: var(--space-4) 0;
  border-top: 1px solid var(--line);
}

.feature h3 {
  margin-bottom: var(--space-1);
}

.feature p {
  margin-bottom: 0;
  font-size: var(--text-sm);
}

/* --------------------------------------------------------------------------
   13. Footer
   -------------------------------------------------------------------------- */
.site-footer {
  padding-block: var(--space-5) var(--space-4);
  background: var(--cream-deep);
  border-top: 1px solid var(--line);
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

.site-footer a {
  transition: color 0.3s var(--ease);
}

.site-footer a:hover {
  color: var(--accent-deep);
}

.site-footer__grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.site-footer__bottom {
  padding-top: var(--space-3);
  border-top: 1px solid var(--line);
  font-size: var(--text-xs);
  color: var(--ink-faint);
}

/* --------------------------------------------------------------------------
   14. Responsive
   -------------------------------------------------------------------------- */
@media (max-width: 64rem) {
  .grid--4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 48rem) {
  :root {
    --space-5: 3rem;
    --space-6: 4.5rem;
    --space-7: 6rem;
  }

  body {
    font-size: 1rem;
  }

  .grid--2,
  .grid--3,
  .grid--4 {
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }

  .site-header__inner {
    min-height: 4rem;
  }

  .nav {
    gap: var(--space-3);
  }

  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4) var(--space-2);
  }

  .product-card__footer {
    flex-direction: column;
    align-items: stretch;
  }

  .product-card__footer .btn {
    padding-inline: 1rem;
  }

  .hero__actions .btn {
    width: 100%;
  }

  .site-footer__grid {
    grid-template-columns: 1fr;
    gap: var(--space-3);
  }
}

@media (max-width: 30rem) {
  .product-grid {
    grid-template-columns: 1fr;
  }

  .nav a {
    font-size: var(--text-xs);
  }
}

/* --------------------------------------------------------------------------
   15. Reduced motion
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

  </style>
  <style>
    /* สไตล์เฉพาะหน้าขอบคุณ */
    .thanks {
      display: flex;
      align-items: center;
      min-height: calc(100vh - 4.5rem);
      min-height: calc(100svh - 4.5rem);
      padding-block: var(--space-6);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="thanks">
    <div class="container container--narrow text-center">
      <h1 class="heading-rule">ขอบคุณที่สั่งซื้อ</h1>
      <p class="lead">เราได้รับคำสั่งซื้อของคุณแล้ว ขอบคุณที่เลือก Body Scent</p>
      <div class="hero__actions" style="justify-content: center;">
        <a class="btn" href="index.html">กลับหน้าแรก</a>
      </div>
    </div>
  </main>

</body>
